# CascadeCAD HTTPS location fragment
# Paste these locations INSIDE the existing `server { ... }` block for lftr.biz.
# Keep proxy_pass WITHOUT a trailing slash so /cascade-cad remains in the upstream URL.

location = /cascade-cad {
    return 308 /cascade-cad/;
}

# WebSocket traffic gets upgrade headers. Keeping this separate prevents normal
# upload POST/PUT requests from being incorrectly marked as protocol upgrades.
location ^~ /cascade-cad/ws/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_connect_timeout 30s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /cascade-cad;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location ^~ /cascade-cad/ {
    # Browser uploads are sent as retryable 16 MiB chunks.
    client_max_body_size 20m;
    client_body_timeout 3600s;
    send_timeout 3600s;

    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_connect_timeout 30s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /cascade-cad;
    proxy_set_header Connection "";

    # Stream chunks directly to Quart instead of buffering them to nginx disk.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
