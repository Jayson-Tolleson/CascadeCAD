[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade-cad"
version = "1.0.0"
description = "CascadeCAD: Quart WebCAD with CadQuery/OCP, XBF storage, STEP exchange, and GLB previews"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "LFTR CascadeCAD project"}]
dependencies = [
  "quart>=0.20,<0.21",
  "hypercorn>=0.17,<0.18",
  "cadquery==2.8.0",
  "trimesh>=4.6,<5",
  "networkx>=3.4,<4",
  "numpy>=2.0,<3",
  "lxml>=5,<7",
  "Pillow>=10.0.0",
  "pillow>=10,<13",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
cascade-cad-worker = "webcad_xbf.worker:main"
cascade-cad-sample = "webcad_xbf.sample:main"
cascade-cad-maintenance = "webcad_xbf.maintenance:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["webcad_xbf*"]

[tool.setuptools.package-data]
webcad_xbf = [
  "templates/*.html",
  "static/css/*.css",
  "static/js/*.js",
  "static/vendor/three/*.js",
]

[tool.pytest.ini_options]
pythonpath = ["."]
