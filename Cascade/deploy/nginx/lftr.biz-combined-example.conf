# Example only: merge the include line into your EXISTING lftr.biz HTTPS server.
# Do not replace your certificate paths or existing LFTR locations with placeholders.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lftr.biz www.lftr.biz;

    # KEEP your existing ssl_certificate, ssl_certificate_key, and security settings.
    # KEEP your existing /, /gfs, /broadcast, /watch, and other application locations.

    include /etc/nginx/snippets/cascade-cad.conf;
}
