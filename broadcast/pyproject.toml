[project]
name = "lftr-next"
version = "0.1.0"
description = "LFTR Broadcast Marine Intelligence Globe live/PostGIS architecture"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "google-cloud-speech>=2.28,<3.0",
  "numpy>=1.26,<3.0",
  "netCDF4>=1.6,<2.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = []
postgis = ["psycopg[binary]>=3.2,<4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.broadcast", "app.core", "app.db", "app.schemas", "app.services", "app.fields", "app.layers", "app.spatial", "app.spatial.usgs", "app.providers", "app.prerender"]
